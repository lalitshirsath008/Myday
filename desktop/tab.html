<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>My day</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: visible;
        user-select: none;
        font-family: 'Poppins', 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
      }
      .tab-btn {
        all: unset;
        box-sizing: border-box;
        position: absolute;
        right: 0;
        top: 12px;
        width: 34px;
        height: 112px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 16px 0 0 16px;
        background: #c8530a;
        color: #fff;
        cursor: pointer;
        transition: background 0.15s;
        box-shadow: 0 4px 14px rgba(200, 83, 10, 0.35);
      }
      .tab-btn:hover {
        background: #b34a09;
      }
      .tab-btn:active {
        background: #a33e05;
      }
      svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .label {
        writing-mode: vertical-rl;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .count {
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        padding: 0 4px;
        font-size: 10px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .count:empty {
        display: none;
      }
      .count.all {
        background: #1f9d55;
      }
      /* Unread notifications badge on the top-left shoulder of the tab */
      .unread {
        position: absolute;
        top: 0px;
        left: 2px;
        min-width: 22px;
        height: 22px;
        padding: 0 4px;
        box-sizing: border-box;
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
        border: 2px solid #ffffff;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        z-index: 20;
        animation: pop-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .unread:empty {
        display: none;
      }
      @keyframes pop-in {
        from {
          transform: scale(0.3);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <button id="tab" class="tab-btn" type="button" aria-label="My day" title="My day — click to open, drag to move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 17 2 2 4-4" />
        <path d="m3 7 2 2 4-4" />
        <path d="M13 6h8" />
        <path d="M13 12h8" />
        <path d="M13 18h8" />
      </svg>
      <span class="label">My day</span>
      <span class="count" id="count"></span>
    </button>
    <div class="unread" id="unread" title="Unread notifications"></div>

    <script>
      const tab = document.getElementById('tab');
      const count = document.getElementById('count');
      const unreadEl = document.getElementById('unread');
      let label = { done: 0, total: 0, unread: 0 };
      const describe = () => {
        const parts = [label.total ? `My day: ${label.done} of ${label.total} done` : 'My day'];
        if (label.unread) parts.push(`${label.unread} unread notification${label.unread === 1 ? '' : 's'}`);
        tab.setAttribute('aria-label', parts.join(', '));
      };
      window.rgkTab.onCount((done, total) => {
        count.textContent = total ? `${done}/${total}` : '';
        count.classList.toggle('all', total > 0 && done === total);
        label = { ...label, done, total };
        describe();
      });
      window.rgkTab.onUnread((unread) => {
        unreadEl.textContent = unread ? (unread > 99 ? '99+' : String(unread)) : '';
        label = { ...label, unread };
        describe();
      });

      // Click opens the panel; dragging up or down moves the tab.
      let down = null;
      const onDown = (e) => {
        if (e.button !== 0) return;
        down = { y: e.screenY, dragging: false };
        e.currentTarget.setPointerCapture(e.pointerId);
      };
      const onMove = (e) => {
        if (!down) return;
        if (!down.dragging && Math.abs(e.screenY - down.y) > 4) {
          down.dragging = true;
          window.rgkTab.dragStart();
        }
        if (down.dragging) window.rgkTab.dragMove();
      };
      const onUp = () => {
        if (!down) return;
        if (down.dragging) window.rgkTab.dragEnd();
        else window.rgkTab.toggle();
        down = null;
      };

      tab.addEventListener('pointerdown', onDown);
      tab.addEventListener('pointermove', onMove);
      tab.addEventListener('pointerup', onUp);

      unreadEl.addEventListener('click', (e) => {
        e.stopPropagation();
        window.rgkTab.toggle();
      });

      tab.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') window.rgkTab.toggle();
      });
    </script>
  </body>
</html>
